<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Battle</title>
    <link href="https://cdn.webdatarocks.com/latest/webdatarocks.min.css" rel="stylesheet" />
    <script src="https://cdn.webdatarocks.com/latest/webdatarocks.js"></script>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Sea Battle</h1>
            <h2 id="game-status">Initializing game...</h2>
            <div id="controls">
                <button id="randomize-btn" class="action-btn">Generate Fleet</button>
                <button id="ready-btn" class="action-btn ready-btn" disabled>Ready</button>
                <button id="play-again-btn" class="action-btn play-again-btn">Play Again</button>
            </div>
        </div>
        
        <div class="boards-container">
            <div id="board-mine" class="board"></div>
            <div id="board-enemy" class="board"></div>
        </div>
    </div>

    <script src="main.js"></script>
    <a href="about.html" style="position:fixed;bottom:16px;right:20px;color:rgba(255,255,255,0.45);font-family:'Segoe UI',sans-serif;font-size:12px;text-decoration:none;letter-spacing:0.04em;" onmouseover="this.style.color='rgba(255,255,255,0.9)'" onmouseout="this.style.color='rgba(255,255,255,0.45)'">About</a>
</body>
</html>
